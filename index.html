<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Task Studio - Worker Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dwdtvasykhorrvmwmnhb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3ZHR2YXN5a2hvcnJ2bXdtbmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTUzNzQsImV4cCI6MjEwNjUzMTM3NH0.vt_I7uvUqsjv5e8RTgREMoXJiZqq_80a9fVOqVyW6Lk';
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let activeTasks = [
      {
        id: 1,
        title: "Safaricom Customer Care Call Transcription",
        category: "Data Annotation",
        payout: 3.50,
        spots: 12,
        time_limit: "45 Mins",
        description: "Listen to the customer call audio and transcribe the conversation word-for-word into the submission box below."
      },
      {
        id: 2,
        title: "AI Chatbot Response Quality Evaluation",
        category: "AI Evaluation",
        payout: 2.50,
        spots: 8,
        time_limit: "30 Mins",
        description: "Evaluate Response A vs Response B for tone, safety, and helpfulness. Provide your final breakdown."
      }
    ];

    async function loadTasks() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient.from('tasks').select('*').eq('status', 'active');
        if (data && data.length > 0) activeTasks = data;
        renderTasks();
      } catch (e) {
        renderTasks();
      }
    }

    function renderTasks() {
      const grid = document.getElementById('taskGrid');
      if (!grid) return;
      grid.innerHTML = activeTasks.map(task => `
        <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between hover:border-indigo-500/50 transition-all shadow-lg">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs px-2.5 py-1 rounded-full font-medium">
                ${task.category || 'General Task'}
              </span>
              <!-- TIMELINE BADGE -->
              <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-2.5 py-1 rounded-full font-mono flex items-center gap-1">
                ⏱️ ${task.time_limit || '60 Mins'}
              </span>
            </div>
            
            <h3 class="text-lg font-bold text-white mb-2">${task.title}</h3>
            <p class="text-xs text-slate-300 leading-relaxed mb-4">${task.description}</p>
          </div>

          <div>
            <div class="flex items-center justify-between text-xs text-slate-400 pt-4 border-t border-slate-700/60 mb-4 font-mono">
              <span>Payout: <strong class="text-emerald-400 text-sm">$${parseFloat(task.payout).toFixed(2)}</strong></span>
              <span>Spots left: <strong class="text-slate-200">${task.spots_available || task.spots || 10}</strong></span>
            </div>

            <!-- SUBMISSION TEXTAREA -->
            <div class="space-y-2">
              <textarea id="proofInput-${task.id}" rows="3" placeholder="Paste your transcribed text or completed work link here..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
              <button onclick="submitTask(${task.id})" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs transition-colors shadow-lg shadow-indigo-600/20">
                Submit Task Proof
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function submitTask(taskId) {
      const proofText = document.getElementById(`proofInput-${taskId}`).value;
      if (!proofText.trim()) {
        alert("Please paste your transcribed text or submission proof before submitting!");
        return;
      }

      if (supabaseClient) {
        await supabaseClient.from('submissions').insert([{ task_id: taskId, proof: proofText, status: 'pending' }]);
      }
      alert("Task submitted successfully! Khan is currently reviewing your submission.");
      document.getElementById(`proofInput-${taskId}`).value = '';
    }

    window.addEventListener('DOMContentLoaded', loadTasks);
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-8">
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 backdrop-blur">
      <div>
        <h1 class="text-2xl font-bold text-white">Apex Task Studio</h1>
        <p class="text-xs text-slate-400 mt-1">Worker Task Portal • Earn money completing microtasks</p>
      </div>
      <div class="bg-slate-900 border border-slate-700/80 px-4 py-2 rounded-xl text-right">
        <p class="text-xs text-slate-400">Available Balance</p>
        <p class="text-lg font-bold text-emerald-400 font-mono">$0.00</p>
      </div>
    </header>

    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-white">Available Tasks</h2>
        <span class="text-xs text-slate-400">Select a job & complete within the deadline</span>
      </div>
      <div id="taskGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6"></div>
    </section>
  </div>
</body>
</html>
