<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Task Studio - Admin Terminal</title>
  
  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    const SECRET_PIN = "9999";
    const SUPABASE_URL = 'https://dwdtvasykhorrvmwmnhb.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Replace with your full anon key
    
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // PIN Guard Initialization
    window.addEventListener('DOMContentLoaded', () => {
      sessionStorage.removeItem('admin_authenticated');
      
      const adminContent = document.getElementById('adminMainContent');
      const pinModal = document.getElementById('pinGuardModal');

      if (adminContent) adminContent.classList.add('hidden');
      if (pinModal) pinModal.classList.remove('hidden');
    });

    // Handle PIN Verification
    function handlePinSubmit(e) {
      e.preventDefault();
      const inputPin = document.getElementById('adminPinInput')?.value;
      const errorMessage = document.getElementById('pinErrorMessage');

      if (inputPin === SECRET_PIN) {
        sessionStorage.setItem('admin_authenticated', 'true');
        
        const pinModal = document.getElementById('pinGuardModal');
        const adminContent = document.getElementById('adminMainContent');

        if (pinModal) pinModal.classList.add('hidden');
        if (adminContent) adminContent.classList.remove('hidden');
      } else {
        if (errorMessage) errorMessage.classList.remove('hidden');
      }
    }

    // Handle Task Submission to Supabase
    async function handleCreateTask(e) {
      e.preventDefault();
      const statusMsg = document.getElementById('taskStatusMsg');
      statusMsg.className = "text-sm text-indigo-400 font-semibold";
      statusMsg.innerText = "Publishing task to Supabase...";
      statusMsg.classList.remove('hidden');

      const title = document.getElementById('taskTitle').value;
      const description = document.getElementById('taskDesc').value;
      const payout = parseFloat(document.getElementById('taskPayout').value);
      const spots = parseInt(document.getElementById('taskSpots').value);
      const category = document.getElementById('taskCategory').value;

      try {
        const { data, error } = await supabaseClient
          .from('tasks')
          .insert([
            { title, description, payout, spots_available: spots, category, status: 'active' }
          ]);

        if (error) throw error;

        statusMsg.className = "text-sm text-emerald-400 font-semibold";
        statusMsg.innerText = "Task published successfully!";
        document.getElementById('createTaskForm').reset();
      } catch (err) {
        statusMsg.className = "text-sm text-rose-400 font-semibold";
        statusMsg.innerText = "Error posting task: " + err.message;
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <!-- PIN GUARD MODAL -->
  <div id="pinGuardModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl text-center">
      <h2 class="text-xl font-bold text-slate-100 mb-2">Admin Terminal Access</h2>
      <p class="text-sm text-slate-400 mb-6">Enter your 4-digit PIN to unlock access.</p>
      
      <form onsubmit="handlePinSubmit(event)" class="space-y-4">
        <input 
          type="password" 
          id="adminPinInput" 
          maxlength="4" 
          placeholder="••••" 
          required 
          class="w-full text-center text-2xl tracking-widest bg-slate-900 border border-slate-700 rounded-lg py-2 text-white focus:outline-none focus:border-indigo-500"
        />
        
        <p id="pinErrorMessage" class="text-red-400 text-xs hidden">Invalid PIN. Please try again.</p>
        
        <button 
          type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg transition-colors"
        >
          Unlock Terminal
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN ADMIN TERMINAL DASHBOARD -->
  <div id="adminMainContent" class="hidden w-full max-w-3xl bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">Apex Task Studio</h1>
        <p class="text-xs text-slate-400">Admin Control Panel • Post & Manage Tasks</p>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1 rounded-full font-mono">
        Supabase Active
      </span>
    </div>

    <!-- CREATE TASK FORM -->
    <form id="createTaskForm" onsubmit="handleCreateTask(event)" class="space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">Post a New Task</h2>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Task Title</label>
        <input type="text" id="taskTitle" required placeholder="e.g. Data Annotation - Image Classification" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
          <select id="taskCategory" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <option value="Data Annotation">Data Annotation</option>
            <option value="AI Evaluation">AI Evaluation</option>
            <option value="Microtask">Microtask</option>
            <option value="Research">Research</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Payout ($)</label>
          <input type="number" step="0.01" id="taskPayout" required placeholder="2.50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Worker Spots</label>
          <input type="number" id="taskSpots" required placeholder="50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Task Instructions / Description</label>
        <textarea id="taskDesc" rows="4" required placeholder="Provide step-by-step instructions for workers..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"></textarea>
      </div>

      <div class="flex items-center justify-between pt-2">
        <p id="taskStatusMsg" class="text-sm hidden"></p>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition-colors ml-auto">
          Publish Task
        </button>
      </div>
    </form>
  </div>

</body>
</html>
