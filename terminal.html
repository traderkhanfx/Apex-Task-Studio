<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Task Studio — Admin Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f0a2e 0%, #1a1145 50%, #0a1a3e 100%);
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .glass {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.15);
      box-shadow: 0 8px 32px rgba(88, 28, 135, 0.15);
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: #ffffff;
      font-weight: 600;
      transition: all 0.25s;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-ghost {
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.25);
      color: #c4b5fd;
    }
    .input-field {
      width: 100%; padding: 0.75rem; border-radius: 0.5rem;
      background: #ffffff; border: 1.5px solid #e0e7ff;
      color: #1e1b4b; font-size: 0.875rem; outline: none;
    }
    .badge { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 600; }
    .badge-amber { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
    .badge-green { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge-red { background: rgba(239, 68, 68, 0.15); color: #f87171; }
  </style>
</head>
<body class="p-4 pb-12">

  <div class="max-w-6xl mx-auto">
    <!-- HEADER -->
    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">⚙️ APEX ADMIN PANEL</h1>
        <p class="text-xs text-purple-300/60">Task Creation, Submissions & M-Pesa Payouts</p>
      </div>
      <a href="index.html" class="btn-ghost px-4 py-2 rounded-lg text-xs font-medium">← Worker Portal</a>
    </header>

    <!-- POST TASK FORM -->
    <div class="glass p-5 rounded-xl mb-8">
      <h2 class="text-lg font-bold text-white mb-3">➕ Post New Work Task</h2>
      <form id="createTaskForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="text" id="taskTitle" placeholder="Task Title (e.g. Audio Transcription #4)" required class="input-field" />
        <input type="text" id="taskCategory" placeholder="Category (e.g. Transcription, Verification)" required class="input-field" />
        <input type="number" step="0.01" id="taskPayout" placeholder="Payout ($ e.g. 0.50)" required class="input-field" />
        <input type="number" id="taskTime" placeholder="Est. Time (Mins e.g. 5)" required class="input-field" />
        <div class="flex items-center gap-2 bg-slate-900/40 p-2.5 rounded-lg border border-purple-500/20">
          <input type="checkbox" id="taskIsLocked" class="w-4 h-4 accent-purple-600" />
          <label for="taskIsLocked" class="text-xs text-purple-200 font-medium">Locked Task?</label>
          <input type="number" step="0.01" id="taskLockFee" placeholder="Fee ($)" class="input-field !p-1 text-xs w-20 ml-auto hidden" />
        </div>
        <textarea id="taskDesc" placeholder="Full Task Instructions..." required class="input-field md:col-span-3" rows="2"></textarea>
        <button type="submit" class="btn-primary py-3 rounded-lg text-sm font-semibold md:col-span-3 mt-1">🚀 Publish Live Task</button>
      </form>
    </div>

    <!-- PENDING WITHDRAWALS SECTION -->
    <div class="glass p-5 rounded-xl mb-8">
      <h2 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">
        <span>💸</span> Pending M-Pesa Withdrawal Requests
      </h2>
      <div id="withdrawalsContainer" class="space-y-3">
        <p class="text-xs text-purple-300/50">Loading withdrawal requests...</p>
      </div>
    </div>

    <!-- SUBMISSIONS REVIEW SECTION -->
    <div class="glass p-5 rounded-xl">
      <h2 class="text-lg font-bold text-white mb-4">📝 Submitted Work Proofs</h2>
      <div id="submissionsContainer" class="space-y-3">
        <p class="text-xs text-purple-300/50">Loading worker submissions...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dwdtvasykhorrvmwmnhb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3ZHR2YXN5a2hvcnJ2bXdtbmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTUzNzQsImV4cCI6MjEwNjUzMTM3NH0.vt_I7uvUqsjv5e8RTgREMoXJiZqq_80a9fVOqVyW6Lk';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Toggle Lock Fee Input
    document.getElementById('taskIsLocked').addEventListener('change', (e) => {
      document.getElementById('taskLockFee').classList.toggle('hidden', !e.target.checked);
    });

    // Create Task
    document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('taskTitle').value,
        category: document.getElementById('taskCategory').value,
        payout: parseFloat(document.getElementById('taskPayout').value),
        time: parseInt(document.getElementById('taskTime').value),
        description: document.getElementById('taskDesc').value,
        is_locked: document.getElementById('taskIsLocked').checked,
        lock_fee: document.getElementById('taskIsLocked').checked ? parseFloat(document.getElementById('taskLockFee').value || 0) : 0
      };

      try {
        const { error } = await db.from('tasks').insert([payload]);
        if (error) throw error;
        alert('Task Published Successfully!');
        document.getElementById('createTaskForm').reset();
        fetchSubmissions();
      } catch (err) { alert('Error: ' + err.message); }
    });

    // Fetch Withdrawals
    async function fetchWithdrawals() {
      const container = document.getElementById('withdrawalsContainer');
      try {
        const { data, error } = await db.from('withdrawals').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        if (!data || !data.length) {
          container.innerHTML = '<p class="text-xs text-purple-300/50">No pending withdrawal requests.</p>';
          return;
        }

        let html = '';
        data.forEach(w => {
          html += `
            <div class="glass p-3 rounded-lg flex flex-wrap items-center justify-between gap-2 border border-emerald-500/20">
              <div>
                <p class="text-sm font-bold text-white">${w.worker_name} — <span class="text-emerald-400">$${parseFloat(w.amount).toFixed(2)}</span></p>
                <p class="text-xs text-purple-300/80">📱 M-Pesa Line: <strong class="text-white">${w.mpesa_number}</strong></p>
              </div>
              <div class="flex items-center gap-2">
                <span class="badge ${w.status === 'paid' ? 'badge-green' : 'badge-amber'}">${(w.status || 'pending').toUpperCase()}</span>
                ${w.status === 'pending' ? `<button onclick="markPaid('${w.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold">✓ Mark Paid</button>` : ''}
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (err) { container.innerHTML = `<p class="text-xs text-red-400">${err.message}</p>`; }
    }

    async function markPaid(id) {
      if (!confirm('Have you sent the M-Pesa payment from your phone?')) return;
      try {
        const { error } = await db.from('withdrawals').update({ status: 'paid' }).eq('id', id);
        if (error) throw error;
        fetchWithdrawals();
      } catch (err) { alert(err.message); }
    }

    // Fetch Submissions
    async function fetchSubmissions() {
      const container = document.getElementById('submissionsContainer');
      try {
        const { data, error } = await db.from('submissions').select('*').order('created_at', { ascending: false });
        if (error) throw error;

        if (!data || !data.length) {
          container.innerHTML = '<p class="text-xs text-purple-300/50">No submissions uploaded yet.</p>';
          return;
        }

        let html = '';
        data.forEach(s => {
          html += `
            <div class="glass p-3 rounded-lg border border-purple-500/20">
              <div class="flex justify-between items-center mb-1">
                <p class="text-xs font-bold text-purple-300">${s.task_title || 'Task'} | <span class="text-white">${s.worker_name}</span></p>
                <span class="badge ${s.status === 'accepted' ? 'badge-green' : s.status === 'rejected' ? 'badge-red' : 'badge-amber'}">${(s.status || 'pending').toUpperCase()}</span>
              </div>
              <p class="text-xs bg-slate-900/60 p-2 rounded text-slate-200 mb-2 font-mono">${s.proof}</p>
              ${s.status === 'pending' ? `
                <div class="flex gap-2">
                  <button onclick="updateSub('${s.id}', 'accepted')" class="bg-emerald-600 text-white text-xs px-3 py-1 rounded font-bold">Accept</button>
                  <button onclick="updateSub('${s.id}', 'rejected')" class="bg-red-600 text-white text-xs px-3 py-1 rounded font-bold">Reject</button>
                </div>
              ` : ''}
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (err) { container.innerHTML = `<p class="text-xs text-red-400">${err.message}</p>`; }
    }

    async function updateSub(id, status) {
      try {
        const { error } = await db.from('submissions').update({ status }).eq('id', id);
        if (error) throw error;
        fetchSubmissions();
      } catch (err) { alert(err.message); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchWithdrawals();
      fetchSubmissions();
    });
  </script>
</body>
</html>
