<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Task Studio — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0a0f1a; color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
    .card-glow { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    .btn-primary { background: #10b981; color: #022c22; font-weight: 600; transition: all 0.2s; }
    .btn-primary:hover { background: #059669; transform: translateY(-1px); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); transition: all 0.2s; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-content { background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; max-width: 480px; width: 100%; padding: 1.5rem; max-height: 90vh; overflow-y: auto; }
    .hidden { display: none !important; }
    .input-field { width: 100%; padding: 0.75rem; border-radius: 0.5rem; background: rgba(0,0,0,0.3); border: 1px solid #374151; color: white; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
    .input-field:focus { border-color: #10b981; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 0.75rem 0.5rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { color: #9ca3af; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.65rem; }
    .badge { font-size: 0.65rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-weight: 600; }
    .loading-spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #10b981; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ============ ALERT MODAL ============ -->
  <div id="alertModal" class="modal-overlay hidden">
    <div class="modal-content text-center">
      <p id="alertMessage" class="text-base mb-4">Done!</p>
      <button onclick="closeModal('alertModal')" class="btn-primary w-full py-2 rounded-lg text-sm">OK</button>
    </div>
  </div>

  <!-- ============ CONFIRM MODAL ============ -->
  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-content text-center">
      <p id="confirmMessage" class="text-base mb-4">Are you sure?</p>
      <div class="flex gap-3">
        <button id="confirmYes" class="btn-primary flex-1 py-2 rounded-lg text-sm">Yes</button>
        <button onclick="closeModal('confirmModal')" class="btn-ghost flex-1 py-2 rounded-lg text-sm">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ============ MAIN ============ -->
  <div class="max-w-5xl mx-auto p-4 pb-16">

    <!-- HEADER -->
    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl">⚡</span>
          <h1 class="text-xl font-bold tracking-tight">APEX TASK STUDIO</h1>
          <span class="badge bg-emerald-900/50 text-emerald-400">ADMIN</span>
        </div>
        <p class="text-xs text-gray-500">Manage tasks, workers, and payouts</p>
      </div>
      <a href="index.html" class="btn-ghost px-4 py-2 rounded-lg text-xs">← Back to Worker Portal</a>
    </header>

    <!-- STATS ROW -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
      <div class="glass rounded-xl p-4 card-glow">
        <p class="text-xs text-gray-500 uppercase tracking-wider">Total Tasks Posted</p>
        <p class="text-3xl font-bold mt-1" id="statTotalTasks">—</p>
      </div>
      <div class="glass rounded-xl p-4 card-glow">
        <p class="text-xs text-gray-500 uppercase tracking-wider">Active Tasks</p>
        <p class="text-3xl font-bold mt-1 text-emerald-400" id="statActiveTasks">—</p>
      </div>
      <div class="glass rounded-xl p-4 card-glow">
        <p class="text-xs text-gray-500 uppercase tracking-wider">Locked Tasks</p>
        <p class="text-3xl font-bold mt-1 text-amber-400" id="statLockedTasks">—</p>
      </div>
    </div>

    <!-- POST NEW JOB FORM -->
    <div class="glass rounded-xl p-5 card-glow mb-6">
      <h2 class="text-lg font-bold mb-4">📝 Post New Job</h2>
      <form id="postJobForm" class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400 block mb-1">Task Title</label>
            <input type="text" id="jobTitle" placeholder="e.g. Rate AI Chatbot Response" required class="input-field" />
          </div>
          <div>
            <label class="text-xs text-gray-400 block mb-1">Category</label>
            <select id="jobCategory" class="input-field">
              <option value="Data Annotation">Data Annotation</option>
              <option value="Transcription">Transcription</option>
              <option value="AI Evaluation">AI Evaluation</option>
              <option value="Microtask">Microtask</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400 block mb-1">Payout (USD)</label>
            <input type="number" id="jobPayout" placeholder="1.50" step="0.01" min="0.10" required class="input-field" />
          </div>
          <div>
            <label class="text-xs text-gray-400 block mb-1">Estimated Time (minutes)</label>
            <input type="number" id="jobTime" placeholder="10" min="1" required class="input-field" />
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Description</label>
          <textarea id="jobDescription" rows="3" placeholder="Describe what the worker needs to do..." required class="input-field"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 items-end">
          <div class="flex items-center gap-3">
            <input type="checkbox" id="jobLocked" class="w-4 h-4 accent-emerald-500" onchange="toggleLockFee()" />
            <label for="jobLocked" class="text-sm text-gray-300">Locked / Premium Task</label>
          </div>
          <div id="lockFeeContainer" class="hidden">
            <label class="text-xs text-gray-400 block mb-1">Unlock Fee (USD)</label>
            <input type="number" id="jobFee" placeholder="1.50" step="0.01" min="0" class="input-field" />
          </div>
        </div>
        <button type="submit" class="btn-primary w-full py-3 rounded-lg text-sm mt-2">🚀 Post Job to Workers</button>
      </form>
    </div>

    <!-- TASK LIST TABLE -->
    <div class="glass rounded-xl p-5 card-glow">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">📋 All Tasks</h2>
        <button onclick="loadTasks()" class="btn-ghost px-3 py-1.5 rounded-lg text-xs">🔄 Refresh</button>
      </div>
      <div id="adminTaskList">
        <div class="text-center py-12"><div class="loading-spinner"></div><p class="text-sm text-gray-500 mt-3">Loading tasks...</p></div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center text-xs text-gray-600 border-t border-gray-800 pt-6 mt-8">
      <p>© 2026 Apex Task Studio — Admin Panel</p>
    </footer>
  </div>

  <script>
    const SUPABASE_URL = 'https://dwdtvasykhorrvmwmnhb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3ZHR2YXN5a2hvcnJ2bXdtbmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTUzNzQsImV4cCI6MjEwNjUzMTM3NH0.vt_I7uvUqsjv5e8RTgREMoXJiZqq_80a9fVOqVyW6Lk';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function showAlert(msg) {
      document.getElementById('alertMessage').textContent = msg;
      openModal('alertModal');
    }
    function toggleLockFee() {
      const locked = document.getElementById('jobLocked').checked;
      const container = document.getElementById('lockFeeContainer');
      if (locked) container.classList.remove('hidden');
      else container.classList.add('hidden');
    }
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.add('hidden');
      });
    });

    async function loadTasks() {
      const container = document.getElementById('adminTaskList');
      container.innerHTML = '<div class="text-center py-12"><div class="loading-spinner"></div><p class="text-sm text-gray-500 mt-3">Loading tasks...</p></div>';
      try {
        const { data, error } = await db
          .from('tasks')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;

        document.getElementById('statTotalTasks').textContent = data.length;
        document.getElementById('statActiveTasks').textContent = data.filter(t => t.status === 'active').length;
        document.getElementById('statLockedTasks').textContent = data.filter(t => t.is_locked).length;

        if (!data || data.length === 0) {
          container.innerHTML = '<p class="text-center text-gray-500 py-8 text-sm">No tasks posted yet. Use the form above to add your first job.</p>';
          return;
        }
        container.innerHTML = `
          <div class="overflow-x-auto">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Payout</th>
                  <th>Time</th>
                  <th>Locked</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${data.map(t => `
                  <tr>
                    <td class="text-gray-200 font-medium">${t.title || '—'}</td>
                    <td><span class="badge bg-emerald-900/40 text-emerald-400">${t.category || '—'}</span></td>
                    <td class="text-emerald-400 font-bold">$${parseFloat(t.payout || 0).toFixed(2)}</td>
                    <td class="text-gray-400">${t.time || '—'} min</td>
                    <td>${t.is_locked ? `<span class="badge bg-amber-900/40 text-amber-400">🔒 $${parseFloat(t.lock_fee || 0).toFixed(2)}</span>` : '<span class="text-gray-500 text-xs">Free</span>'}</td>
                    <td><button onclick="deleteTask('${t.id}')" class="btn-danger px-3 py-1 rounded-md text-xs">Delete</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        console.error('Load tasks error:', err);
        container.innerHTML = `<p class="text-center text-red-400 py-8 text-sm">Failed to load tasks.<br><span class="text-gray-500 text-xs">${err.message}</span></p>`;
      }
    }

    document.getElementById('postJobForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('jobTitle').value.trim();
      const category = document.getElementById('jobCategory').value;
      const payout = parseFloat(document.getElementById('jobPayout').value);
      const time = parseInt(document.getElementById('jobTime').value);
      const description = document.getElementById('jobDescription').value.trim();
      const is_locked = document.getElementById('jobLocked').checked;
      const lock_fee = is_locked ? parseFloat(document.getElementById('jobFee').value) || 0 : 0;

      if (!title || !description || !payout || !time) {
        showAlert('Please fill in all required fields.');
        return;
      }
      if (is_locked && lock_fee <= 0) {
        showAlert('Please enter a valid unlock fee for locked tasks.');
        return;
      }

      const payload = {
        title,
        category,
        payout,
        time,
        description,
        is_locked,
        lock_fee,
        status: 'active'
      };

      try {
        const { error } = await db.from('tasks').insert([payload]);
        if (error) throw error;
        showAlert('✅ Job posted successfully! It will now appear on the worker portal.');
        document.getElementById('postJobForm').reset();
        toggleLockFee();
        loadTasks();
      } catch (err) {
        console.error('Post job error:', err);
        showAlert('❌ Failed to post job: ' + err.message);
      }
    });

    function deleteTask(id) {
      document.getElementById('confirmMessage').textContent = 'Delete this task? Workers will no longer see it.';
      document.getElementById('confirmModal').classList.remove('hidden');
      document.getElementById('confirmYes').onclick = async () => {
        closeModal('confirmModal');
        try {
          const { error } = await db.from('tasks').delete().eq('id', id);
          if (error) throw error;
          showAlert('✅ Task deleted successfully.');
          loadTasks();
        } catch (err) {
          console.error('Delete error:', err);
          showAlert('❌ Failed to delete task: ' + err.message);
        }
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTasks();
    });
  </script>
</body>
</html>
