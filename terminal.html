<!-- SCRIPT -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SECRET_PIN = "9999"; // Your admin PIN

        const SUPABASE_URL = 'https://dwdtvasykhorrvmwmnhb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3ZHR2YXN5a2hvcnJ2bXdtbmhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTUzNzQsImV4cCI6MjEwNjUzMTM3NH0.vt_I7uvUqsjv5e8RTgREMoXJiZqq_80a9fVOqVyW6Lk';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // FORCE PIN GUARD ON EVERY PAGE LOAD
        window.addEventListener('DOMContentLoaded', () => {
            sessionStorage.removeItem('admin_authenticated');
            document.getElementById('adminMainContent').classList.add('hidden');
            document.getElementById('pinGuardModal').classList.remove('hidden');
        });

        function handlePinSubmit(e) {
            e.preventDefault();
            const inputPin = document.getElementById('adminPinInput').value;
            const errEl = document.getElementById('pinError');

            if (inputPin === SECRET_PIN) {
                sessionStorage.setItem('admin_authenticated', 'true');
                document.getElementById('pinGuardModal').classList.add('hidden');
                document.getElementById('adminMainContent').classList.remove('hidden');
                fetchAdminTasks();
            } else {
                errEl.classList.remove('hidden');
                document.getElementById('adminPinInput').value = '';
            }
        }

        function lockTerminal() {
            sessionStorage.removeItem('admin_authenticated');
            document.getElementById('adminMainContent').classList.add('hidden');
            document.getElementById('pinGuardModal').classList.remove('hidden');
            document.getElementById('adminPinInput').value = '';
        }

        function openPostModal() {
            document.getElementById('postTaskModal').classList.remove('hidden');
        }

        function closePostModal() {
            document.getElementById('postTaskModal').classList.add('hidden');
        }

        // FETCH ALL TASKS FOR ADMIN VIEW
        async function fetchAdminTasks() {
            const listEl = document.getElementById('adminTasksList');
            const totalEl = document.getElementById('statTotalTasks');

            try {
                const { data: tasks, error } = await supabaseClient
                    .from('tasks')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                totalEl.textContent = tasks ? tasks.length : '0';

                if (!tasks || tasks.length === 0) {
                    listEl.innerHTML = `
                        <div class="col-span-full text-center py-8 text-slate-500 text-xs">
                            No tasks posted yet. Click "Post Client Task Batch" above to add your first job.
                        </div>
                    `;
                    return;
                }

                listEl.innerHTML = tasks.map(t => `
                    <div class="bg-[#0b1329] border border-slate-800 rounded-xl p-5 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] uppercase font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">${t.category}</span>
                                <h4 class="font-bold text-white mt-1">${t.title}</h4>
                            </div>
                            <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-lg">KSh ${t.payout_kes}</span>
                        </div>
                        <p class="text-xs text-slate-400">${t.description}</p>
                        <div class="flex justify-between items-center text-[10px] text-slate-500 pt-2 border-t border-slate-800">
                            <span>ID: #${t.id}</span>
                            <button onclick="deleteTask(${t.id})" class="text-red-400 hover:text-red-300 font-semibold">
                                <i class="fa-solid fa-trash-can"></i> Delete Task
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                listEl.innerHTML = `<div class="col-span-full text-red-400 text-xs text-center py-4">Error loading tasks: ${err.message}</div>`;
            }
        }

        // HANDLE POSTING NEW TASK BATCH TO SUPABASE
        async function handlePostTaskSubmit(e) {
            e.preventDefault();

            const publishBtn = document.getElementById('publishBtn');
            publishBtn.textContent = 'Publishing...';
            publishBtn.disabled = true;

            const title = document.getElementById('adminTaskTitle').value.trim();
            const category = document.getElementById('adminTaskCategory').value;
            const payout_kes = parseFloat(document.getElementById('adminTaskPayout').value);
            const description = document.getElementById('adminTaskInstructions').value.trim();

            try {
                const { data, error } = await supabaseClient
                    .from('tasks')
                    .insert([{ title, category, payout_kes, description }]);

                if (error) {
                    alert('Database Error: ' + error.message);
                    return;
                }

                alert('New task batch successfully published to Worker Dashboard!');
                closePostModal();

                document.getElementById('adminTaskTitle').value = '';
                document.getElementById('adminTaskPayout').value = '';
                document.getElementById('adminTaskInstructions').value = '';

                fetchAdminTasks();

            } catch (err) {
                alert('Failed to publish task: ' + err.message);
            } finally {
                publishBtn.textContent = 'Publish Batch to Workers';
                publishBtn.disabled = false;
            }
        }

        // DELETE TASK OPTION
        async function deleteTask(taskId) {
            if (!confirm('Are you sure you want to delete this task from the worker dashboard?')) return;

            try {
                const { error } = await supabaseClient
                    .from('tasks')
                    .delete()
                    .eq('id', taskId);

                if (error) {
                    alert('Error deleting task: ' + error.message);
                    return;
                }

                alert('Task removed successfully!');
                fetchAdminTasks();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
