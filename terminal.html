<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Task Studio - Admin Terminal</title>
  
  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. Supabase JS CDN (Loaded before custom script) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // Configuration
    const SECRET_PIN = "9999";
    const SUPABASE_URL = 'https://dwdtvasykhorrvmwmnhb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Replace with full anon key if needed
    
    // Initialize Supabase safely using window reference
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // PIN Guard Initialization
    window.addEventListener('DOMContentLoaded', () => {
      sessionStorage.removeItem('admin_authenticated');
      
      const adminContent = document.getElementById('adminMainContent');
      const pinModal = document.getElementById('pinGuardModal');

      if (adminContent) adminContent.classList.add('hidden');
      if (pinModal) pinModal.classList.remove('hidden');
    });

    // Handle PIN Verification
    function handlePinSubmit(e) {
      e.preventDefault();
      const inputPin = document.getElementById('adminPinInput')?.value;
      const errorMessage = document.getElementById('pinErrorMessage');

      if (inputPin === SECRET_PIN) {
        sessionStorage.setItem('admin_authenticated', 'true');
        
        const pinModal = document.getElementById('pinGuardModal');
        const adminContent = document.getElementById('adminMainContent');

        if (pinModal) pinModal.classList.add('hidden');
        if (adminContent) adminContent.classList.remove('hidden');
      } else {
        if (errorMessage) errorMessage.classList.remove('hidden');
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <!-- PIN GUARD MODAL (Visible by default on load) -->
  <div id="pinGuardModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl text-center">
      <h2 class="text-xl font-bold text-slate-100 mb-2">Admin Terminal Access</h2>
      <p class="text-sm text-slate-400 mb-6">Enter your 4-digit PIN to unlock access.</p>
      
      <form onsubmit="handlePinSubmit(event)" class="space-y-4">
        <input 
          type="password" 
          id="adminPinInput" 
          maxlength="4" 
          placeholder="••••" 
          required 
          class="w-full text-center text-2xl tracking-widest bg-slate-900 border border-slate-700 rounded-lg py-2 text-white focus:outline-none focus:border-indigo-500"
        />
        
        <p id="pinErrorMessage" class="text-red-400 text-xs hidden">Invalid PIN. Please try again.</p>
        
        <button 
          type="submit" 
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg transition-colors"
        >
          Unlock Terminal
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN ADMIN CONTENT (Hidden until PIN verification) -->
  <div id="adminMainContent" class="hidden w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
    <h1 class="text-2xl font-bold mb-4 text-indigo-400">Apex Task Studio - Terminal</h1>
    <p class="text-slate-300">Welcome to the admin control panel. Supabase status: Connected.</p>
  </div>

</body>
</html>
